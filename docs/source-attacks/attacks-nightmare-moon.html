<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Атаки Принцессы Луны — Flappy Dodge</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        #tabs {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tab-btn {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        #hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 100;
            text-align: center;
        }
        #player-indicator {
            position: absolute;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 0.7rem;
            pointer-events: none;
            z-index: 100;
            text-align: center;
            line-height: 1.3;
        }
        #player-indicator .arrow {
            font-size: 1.5rem;
            display: block;
            animation: pulse-arrow 1s infinite alternate;
        }
        @keyframes pulse-arrow {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="hint">🖱 Кликните в любом месте — запустить атаку<br>↕ Игрок может двигаться только вверх/вниз</div>
    <div id="player-indicator">
        <span class="arrow">↕</span>
        ИГРОК
    </div>
    <div id="tabs"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();

            // ============================================================
            // 1. ЛУННЫЙ ЛУЧ (Moon Beam)
            // ============================================================
            class MoonBeam {
                constructor() {
                    this.dead = false;
                    this.time = 0;
                    this.maxTime = 140;
                    this.y = height * (0.35 + Math.random() * 0.3);
                    this.thickness = 60 + Math.random() * 40;
                    this.warningTime = 50;
                    
                    this.particles = [];
                }

                update() {
                    this.time++;
                    if (this.time > this.maxTime) this.dead = true;
                    
                    if (this.time > this.warningTime && this.time < this.maxTime - 20) {
                        if (Math.random() < 0.8) {
                            this.particles.push({
                                x: Math.random() * width,
                                y: this.y + (Math.random() - 0.5) * this.thickness,
                                vx: (Math.random() - 0.5) * 2,
                                vy: (Math.random() - 0.5) * 2,
                                life: 20 + Math.random() * 20,
                                maxLife: 40,
                                size: 2 + Math.random() * 3
                            });
                        }
                    }
                    
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life--;
                        if (p.life <= 0) this.particles.splice(i, 1);
                    }
                }

                draw() {
                    if (this.time < this.warningTime) {
                        const warnAlpha = 0.3 + Math.sin(this.time * 0.3) * 0.3;
                        
                        ctx.save();
                        ctx.strokeStyle = `rgba(200, 180, 255, ${warnAlpha})`;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([15, 10]);
                        ctx.lineDashOffset = -this.time * 2;
                        ctx.shadowColor = '#aa88ff';
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.moveTo(0, this.y);
                        ctx.lineTo(width, this.y);
                        ctx.stroke();
                        ctx.restore();
                        
                        const zoneProgress = this.time / this.warningTime;
                        const zoneThickness = this.thickness * zoneProgress;
                        ctx.fillStyle = `rgba(150, 100, 255, ${0.15 * zoneProgress})`;
                        ctx.fillRect(0, this.y - zoneThickness / 2, width, zoneThickness);
                        
                        ctx.save();
                        ctx.globalAlpha = warnAlpha;
                        ctx.fillStyle = '#aa88ff';
                        ctx.font = 'bold 16px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('⚠ ПРИГОТОВЬТЕСЬ ⚠', width / 2, this.y - this.thickness / 2 - 20);
                        ctx.restore();
                    }
                    else if (this.time < this.maxTime - 20) {
                        const glowGrad = ctx.createLinearGradient(0, this.y - this.thickness, 0, this.y + this.thickness);
                        glowGrad.addColorStop(0, 'rgba(120, 100, 255, 0)');
                        glowGrad.addColorStop(0.3, 'rgba(150, 120, 255, 0.4)');
                        glowGrad.addColorStop(0.5, 'rgba(200, 180, 255, 0.7)');
                        glowGrad.addColorStop(0.7, 'rgba(150, 120, 255, 0.4)');
                        glowGrad.addColorStop(1, 'rgba(120, 100, 255, 0)');
                        ctx.fillStyle = glowGrad;
                        ctx.fillRect(0, this.y - this.thickness, width, this.thickness * 2);
                        
                        const beamGrad = ctx.createLinearGradient(0, this.y - this.thickness / 2, 0, this.y + this.thickness / 2);
                        beamGrad.addColorStop(0, 'rgba(100, 80, 220, 0.5)');
                        beamGrad.addColorStop(0.3, 'rgba(180, 150, 255, 0.9)');
                        beamGrad.addColorStop(0.5, 'rgba(255, 240, 255, 1)');
                        beamGrad.addColorStop(0.7, 'rgba(180, 150, 255, 0.9)');
                        beamGrad.addColorStop(1, 'rgba(100, 80, 220, 0.5)');
                        ctx.fillStyle = beamGrad;
                        ctx.fillRect(0, this.y - this.thickness / 2, width, this.thickness);
                        
                        ctx.fillStyle = 'rgba(255, 255, 255, 1)';
                        ctx.shadowColor = '#aa88ff';
                        ctx.shadowBlur = 30;
                        ctx.fillRect(0, this.y - 8, width, 16);
                        
                        for (let i = 0; i < 8; i++) {
                            const waveX = (this.time * 5 + i * 200) % (width + 100) - 50;
                            const waveY = this.y + Math.sin(this.time * 0.1 + i) * (this.thickness * 0.3);
                            ctx.fillStyle = `rgba(255, 255, 255, ${0.8 - Math.abs(waveY - this.y) / this.thickness})`;
                            ctx.beginPath();
                            ctx.arc(waveX, waveY, 4 + Math.sin(this.time * 0.2 + i) * 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        
                        for (let i = 0; i < 5; i++) {
                            const mx = (this.time * 8 + i * 300) % (width + 100) - 50;
                            const my = this.y;
                            
                            ctx.save();
                            ctx.translate(mx, my);
                            ctx.rotate(this.time * 0.05 + i);
                            
                            ctx.fillStyle = 'rgba(255, 250, 200, 0.9)';
                            ctx.shadowColor = '#ffff88';
                            ctx.shadowBlur = 20;
                            ctx.beginPath();
                            ctx.arc(0, 0, 12, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.fillStyle = 'rgba(100, 80, 220, 1)';
                            ctx.shadowBlur = 0;
                            ctx.beginPath();
                            ctx.arc(5, 0, 11, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.restore();
                        }
                        
                        for (const p of this.particles) {
                            const a = p.life / p.maxLife;
                            ctx.globalAlpha = a;
                            ctx.fillStyle = '#ccbbff';
                            ctx.shadowColor = '#aa88ff';
                            ctx.shadowBlur = 10;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.globalAlpha = 1;
                    }
                    else {
                        const fadeProgress = (this.time - (this.maxTime - 20)) / 20;
                        const fadeAlpha = 1 - fadeProgress;
                        
                        ctx.globalAlpha = fadeAlpha;
                        ctx.fillStyle = 'rgba(180, 150, 255, 0.6)';
                        ctx.fillRect(0, this.y - this.thickness / 2 * fadeAlpha, width, this.thickness * fadeAlpha);
                        ctx.globalAlpha = 1;
                    }
                }
            }

            // ============================================================
            // 2. ЛУННЫЕ КОЛОННЫ (Moon Pillars) — ДВА ПРОХОДА
            // ============================================================
            class MoonPillars {
                constructor() {
                    this.dead = false;
                    this.time = 0;
                    this.maxTime = 260;
                    this.speed = 3.2;
                    
                    this.x = width + 100;
                    this.pillarWidth = 100;
                    
                    // Создаём ДВА прохода (три колонны — верхняя, средняя, нижняя)
                    // Проход 1: между верхней и средней колонной
                    // Проход 2: между средней и нижней колонной
                    
                    const totalH = height;
                    const marginTop = 30;
                    const marginBottom = 30;
                    
                    // Определяем два прохода с рандомом
                    const gap1H = 110 + Math.random() * 50;
                    const gap2H = 110 + Math.random() * 50;
                    
                    // Размещаем проходы равномерно
                    const available = totalH - marginTop - marginBottom - gap1H - gap2H - 60; // 60 - средняя колонна
                    
                    // Верхняя колонна
                    const topPillarBottom = marginTop + Math.max(40, available * Math.random() * 0.5);
                    // Средняя колонна (между двумя проходами)
                    const middlePillarTop = topPillarBottom + gap1H;
                    const middlePillarBottom = middlePillarTop + 60;
                    // Нижняя колонна
                    const bottomPillarTop = middlePillarBottom + gap2H;
                    
                    // Сохраняем для отрисовки
                    this.topPillar = { y: 0, h: topPillarBottom };
                    this.middlePillar = { y: middlePillarTop, h: 60 };
                    this.bottomPillar = { y: bottomPillarTop, h: totalH - bottomPillarTop };
                    
                    this.gap1 = { y: topPillarBottom, h: gap1H };
                    this.gap2 = { y: middlePillarBottom, h: gap2H };
                    
                    // Частицы
                    this.particles = [];
                    
                    // Декоративные кристаллы на колоннах
                    this.crystals = [];
                    for (let i = 0; i < 8; i++) {
                        this.crystals.push({
                            side: Math.floor(Math.random() * 3), // 0=верх, 1=сред, 2=низ
                            yOffset: Math.random(),
                            phase: Math.random() * Math.PI * 2,
                            size: 4 + Math.random() * 6
                        });
                    }
                }

                update() {
                    this.time++;
                    this.x -= this.speed;
                    
                    if (this.x < -this.pillarWidth - 200 || this.time > this.maxTime) {
                        this.dead = true;
                    }
                    
                    // Спавн частиц у краёв колонн
                    if (Math.random() < 0.7) {
                        this.particles.push({
                            x: this.x + Math.random() * this.pillarWidth,
                            y: Math.random() * height,
                            vx: -this.speed * 0.5 + (Math.random() - 0.5) * 2,
                            vy: (Math.random() - 0.5) * 1.5,
                            life: 25 + Math.random() * 15,
                            maxLife: 40,
                            size: 1.5 + Math.random() * 2.5,
                            hue: 240 + Math.random() * 60
                        });
                    }
                    
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life--;
                        if (p.life <= 0) this.particles.splice(i, 1);
                    }
                    
                    for (const c of this.crystals) c.phase += 0.03;
                }

                drawPillar(pillar) {
                    if (pillar.h <= 0) return;
                    
                    const px = this.x;
                    const pw = this.pillarWidth;
                    const py = pillar.y;
                    const ph = pillar.h;
                    
                    // Свечение вокруг колонны
                    const glow = ctx.createLinearGradient(px - 15, 0, px + pw + 15, 0);
                    glow.addColorStop(0, 'rgba(120, 100, 220, 0)');
                    glow.addColorStop(0.5, 'rgba(150, 120, 255, 0.3)');
                    glow.addColorStop(1, 'rgba(120, 100, 220, 0)');
                    ctx.fillStyle = glow;
                    ctx.fillRect(px - 15, py, pw + 30, ph);
                    
                    // Основа колонны (градиент)
                    const grad = ctx.createLinearGradient(px, 0, px + pw, 0);
                    grad.addColorStop(0, 'rgba(60, 40, 130, 0.95)');
                    grad.addColorStop(0.3, 'rgba(100, 80, 190, 0.95)');
                    grad.addColorStop(0.5, 'rgba(140, 110, 230, 0.95)');
                    grad.addColorStop(0.7, 'rgba(100, 80, 190, 0.95)');
                    grad.addColorStop(1, 'rgba(60, 40, 130, 0.95)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(px, py, pw, ph);
                    
                    // Вертикальные светящиеся полосы
                    for (let i = 1; i < 4; i++) {
                        const lx = px + (i / 4) * pw;
                        ctx.strokeStyle = `rgba(180, 150, 255, ${0.3 + Math.sin(this.time * 0.1 + i) * 0.15})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(lx, py);
                        ctx.lineTo(lx, py + ph);
                        ctx.stroke();
                    }
                    
                    // Края колонны (светящиеся)
                    ctx.fillStyle = 'rgba(200, 180, 255, 0.9)';
                    ctx.shadowColor = '#aa88ff';
                    ctx.shadowBlur = 20;
                    ctx.fillRect(px, py, 3, ph);
                    ctx.fillRect(px + pw - 3, py, 3, ph);
                    
                    // Верхний и нижний край (если не касаются экрана)
                    if (py > 0) {
                        ctx.fillRect(px, py, pw, 3);
                    }
                    if (py + ph < height) {
                        ctx.fillRect(px, py + ph - 3, pw, 3);
                    }
                    ctx.shadowBlur = 0;
                    
                    // Лунные символы на колонне
                    const symbolCount = Math.floor(ph / 80);
                    for (let i = 0; i < symbolCount; i++) {
                        const cy = py + (i + 0.5) * (ph / symbolCount);
                        const pulse = Math.sin(this.time * 0.05 + i) * 0.5 + 0.5;
                        
                        ctx.save();
                        ctx.translate(px + pw / 2, cy);
                        ctx.globalAlpha = 0.5 + pulse * 0.4;
                        
                        // Полумесяц
                        ctx.fillStyle = '#ffffcc';
                        ctx.shadowColor = '#ffff88';
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(0, 0, 10 + pulse * 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = 'rgba(100, 80, 200, 1)';
                        ctx.shadowBlur = 0;
                        ctx.beginPath();
                        ctx.arc(4, 0, 8 + pulse * 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.restore();
                    }
                    
                    // Кристаллы на колонне
                    for (const c of this.crystals) {
                        if (c.side !== (py === 0 ? 0 : py + ph < height ? 1 : 2)) continue;
                        
                        const cy = py + c.yOffset * ph;
                        const cx = px + (Math.sin(c.phase) * 0.3 + 0.5) * pw;
                        
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(c.phase);
                        
                        ctx.fillStyle = '#ccbbff';
                        ctx.shadowColor = '#aa88ff';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.moveTo(0, -c.size);
                        ctx.lineTo(c.size * 0.6, 0);
                        ctx.lineTo(0, c.size);
                        ctx.lineTo(-c.size * 0.6, 0);
                        ctx.closePath();
                        ctx.fill();
                        
                        ctx.restore();
                    }
                }

                draw() {
                    // Верхняя колонна (от верха экрана до gap1)
                    this.drawPillar(this.topPillar);
                    
                    // Средняя колонна (между gap1 и gap2)
                    this.drawPillar(this.middlePillar);
                    
                    // Нижняя колонна (от gap2 до низа)
                    this.drawPillar(this.bottomPillar);
                    
                    // Подсветка проходов
                    this.drawGap(this.gap1);
                    this.drawGap(this.gap2);
                    
                    // Частицы
                    for (const p of this.particles) {
                        const a = p.life / p.maxLife;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = `hsl(${p.hue}, 100%, 70%)`;
                        ctx.shadowColor = `hsl(${p.hue}, 100%, 70%)`;
                        ctx.shadowBlur = 8;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }

                drawGap(gap) {
                    if (gap.h <= 0) return;
                    
                    const px = this.x;
                    const pw = this.pillarWidth;
                    
                    // Мягкая подсветка прохода
                    const gapGlow = ctx.createLinearGradient(px, gap.y, px, gap.y + gap.h);
                    gapGlow.addColorStop(0, 'rgba(180, 150, 255, 0.5)');
                    gapGlow.addColorStop(0.5, 'rgba(200, 180, 255, 0.1)');
                    gapGlow.addColorStop(1, 'rgba(180, 150, 255, 0.5)');
                    ctx.fillStyle = gapGlow;
                    ctx.fillRect(px, gap.y, pw, gap.h);
                    
                    // Стрелки-указатели (подсказка куда лететь)
                    const arrowAlpha = 0.3 + Math.sin(this.time * 0.1) * 0.2;
                    ctx.fillStyle = `rgba(255, 255, 200, ${arrowAlpha})`;
                    ctx.font = 'bold 20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('▲ ▼', px + pw / 2, gap.y + gap.h / 2 + 7);
                    
                    // Звёзды в проходе
                    for (let i = 0; i < 4; i++) {
                        const sx = px + 20 + i * (pw - 40) / 3;
                        const sy = gap.y + gap.h / 2 + Math.sin(this.time * 0.05 + i) * (gap.h * 0.2);
                        const twinkle = Math.sin(this.time * 0.1 + i) * 0.5 + 0.5;
                        ctx.fillStyle = `rgba(255, 255, 200, ${0.4 + twinkle * 0.6})`;
                        ctx.shadowColor = '#ffff88';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 1 + twinkle * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }
            }

            // ============================================================
            // 3. ЛУННЫЙ РАЗЛОМ (Moon Rift) — Безопасные полосы сверху/снизу
            // ============================================================
            class MoonRift {
                constructor() {
                    this.dead = false;
                    this.time = 0;
                    this.maxTime = 180;
                    this.speed = 4;
                    
                    this.x = width + 100;
                    this.width = 80;
                    
                    // Горизонтальная полоса, где находится опасность (середина экрана)
                    // Безопасно сверху и снизу
                    this.dangerTop = height * 0.3;
                    this.dangerBottom = height * 0.7;
                    
                    this.particles = [];
                }

                update() {
                    this.time++;
                    this.x -= this.speed;
                    
                    if (this.x < -this.width - 100 || this.time > this.maxTime) {
                        this.dead = true;
                    }
                    
                    // Частицы разлома
                    if (Math.random() < 0.8) {
                        this.particles.push({
                            x: this.x + Math.random() * this.width,
                            y: this.dangerTop + Math.random() * (this.dangerBottom - this.dangerTop),
                            vx: (Math.random() - 0.5) * 3,
                            vy: (Math.random() - 0.5) * 3,
                            life: 25 + Math.random() * 20,
                            maxLife: 45,
                            size: 2 + Math.random() * 4,
                            hue: 260 + Math.random() * 40
                        });
                    }
                    
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life--;
                        if (p.life <= 0) this.particles.splice(i, 1);
                    }
                }

                draw() {
                    const px = this.x;
                    const pw = this.width;
                    
                    // Опасная зона (разлом в середине экрана)
                    const riftGrad = ctx.createLinearGradient(px, 0, px + pw, 0);
                    riftGrad.addColorStop(0, 'rgba(60, 20, 100, 0.7)');
                    riftGrad.addColorStop(0.5, 'rgba(140, 60, 200, 0.9)');
                    riftGrad.addColorStop(1, 'rgba(60, 20, 100, 0.7)');
                    ctx.fillStyle = riftGrad;
                    ctx.fillRect(px, this.dangerTop, pw, this.dangerBottom - this.dangerTop);
                    
                    // Тёмный разлом (центр)
                    const darkGrad = ctx.createLinearGradient(px, this.dangerTop, px, this.dangerBottom);
                    darkGrad.addColorStop(0, 'rgba(20, 0, 40, 0)');
                    darkGrad.addColorStop(0.3, 'rgba(20, 0, 40, 0.9)');
                    darkGrad.addColorStop(0.7, 'rgba(20, 0, 40, 0.9)');
                    darkGrad.addColorStop(1, 'rgba(20, 0, 40, 0)');
                    ctx.fillStyle = darkGrad;
                    ctx.fillRect(px + pw * 0.2, this.dangerTop, pw * 0.6, this.dangerBottom - this.dangerTop);
                    
                    // Края разлома (светящиеся)
                    ctx.fillStyle = 'rgba(200, 150, 255, 0.9)';
                    ctx.shadowColor = '#aa88ff';
                    ctx.shadowBlur = 25;
                    ctx.fillRect(px, this.dangerTop, pw, 4);
                    ctx.fillRect(px, this.dangerBottom - 4, pw, 4);
                    
                    // Молнии внутри разлома
                    for (let i = 0; i < 4; i++) {
                        const boltY = this.dangerTop + 20 + Math.random() * (this.dangerBottom - this.dangerTop - 40);
                        ctx.strokeStyle = `rgba(180, 130, 255, ${0.5 + Math.random() * 0.5})`;
                        ctx.lineWidth = 1.5;
                        ctx.shadowColor = '#aa88ff';
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.moveTo(px + 10, boltY);
                        let cx = px + 10;
                        let cy = boltY;
                        for (let j = 0; j < 5; j++) {
                            cx += (pw - 20) / 5 + (Math.random() - 0.5) * 15;
                            cy += (Math.random() - 0.5) * 25;
                            ctx.lineTo(cx, cy);
                        }
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                    
                    // Частицы (энергия разлома)
                    for (const p of this.particles) {
                        const a = p.life / p.maxLife;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = `hsl(${p.hue}, 100%, 70%)`;
                        ctx.shadowColor = `hsl(${p.hue}, 100%, 70%)`;
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    
                    // Подсказки безопасных зон (только для наглядности)
                    ctx.save();
                    ctx.globalAlpha = 0.15 + Math.sin(this.time * 0.1) * 0.1;
                    ctx.fillStyle = '#88ff88';
                    // Безопасно сверху
                    ctx.fillRect(px, 0, pw, this.dangerTop);
                    // Безопасно снизу
                    ctx.fillRect(px, this.dangerBottom, pw, height - this.dangerBottom);
                    ctx.restore();
                    
                    // Текст-подсказка "БЕЗОПАСНО"
                    ctx.save();
                    ctx.globalAlpha = 0.4 + Math.sin(this.time * 0.15) * 0.2;
                    ctx.fillStyle = '#88ff88';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.textAlign = 'center';
                    if (this.dangerTop > 40) {
                        ctx.fillText('БЕЗОПАСНО', px + pw / 2, this.dangerTop / 2);
                    }
                    if (height - this.dangerBottom > 40) {
                        ctx.fillText('БЕЗОПАСНО', px + pw / 2, this.dangerBottom + (height - this.dangerBottom) / 2);
                    }
                    ctx.restore();
                }
            }

            // ============================================================
            // СПИСОК АТАК
            // ============================================================
            const attacks = [
                { name: '🌙 Лунный луч', type: 'beam' },
                { name: '🏛 Лунные колонны', type: 'pillars' },
                { name: '🌌 Лунный разлом', type: 'rift' }
            ];

            let currentIndex = 0;

            const tabsContainer = document.getElementById('tabs');
            attacks.forEach((a, i) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
                btn.textContent = a.name;
                btn.onclick = () => {
                    currentIndex = i;
                    document.querySelectorAll('.tab-btn').forEach((b, j) => b.classList.toggle('active', j === i));
                };
                tabsContainer.appendChild(btn);
            });

            const activeAttacks = [];

            canvas.addEventListener('click', () => {
                const attack = attacks[currentIndex];
                
                if (attack.type === 'beam') {
                    activeAttacks.push(new MoonBeam());
                } else if (attack.type === 'pillars') {
                    activeAttacks.push(new MoonPillars());
                } else if (attack.type === 'rift') {
                    activeAttacks.push(new MoonRift());
                }
            });

            function gameLoop() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                for (let i = activeAttacks.length - 1; i >= 0; i--) {
                    activeAttacks[i].update();
                    activeAttacks[i].draw();
                    if (activeAttacks[i].dead) activeAttacks.splice(i, 1);
                }

                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        })();
    </script>
</body>
</html>
