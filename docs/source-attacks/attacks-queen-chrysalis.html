<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Атаки Королевы Кризалис</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        #tabs {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tab-btn {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        #hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="hint">Кликните — атака • Кнопки внизу — сменить тип кислоты</div>
    <div id="tabs"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();

            // ============================================================
            // 1. КИСЛОТНЫЙ ЛАЗЕР (Классический мощный луч)
            // ============================================================
            class AcidLaser {
                constructor(startX, startY, endX, endY) {
                    this.startX = startX;
                    this.startY = startY;
                    this.endX = endX;
                    this.endY = endY;
                    this.angle = Math.atan2(endY - startY, endX - startX);
                    this.dead = false;
                    this.time = 0;
                    this.duration = 70; // ~1.2 секунды
                    
                    this.particles = [];
                }

                update() {
                    this.time++;
                    
                    if (this.time > this.duration) {
                        this.dead = true;
                    }
                    
                    // Частицы вокруг луча
                    if (this.time < this.duration - 20 && Math.random() < 0.6) {
                        const t = Math.random();
                        const px = this.startX + (this.endX - this.startX) * t;
                        const py = this.startY + (this.endY - this.startY) * t;
                        
                        const nx = -Math.sin(this.angle);
                        const ny = Math.cos(this.angle);
                        const spread = (Math.random() - 0.5) * 40;
                        
                        this.particles.push({
                            x: px + nx * spread,
                            y: py + ny * spread,
                            vx: nx * (Math.random() - 0.5) * 4,
                            vy: ny * (Math.random() - 0.5) * 4,
                            life: 20 + Math.random() * 20,
                            maxLife: 40,
                            size: 2 + Math.random() * 4,
                            hue: 80 + Math.random() * 20
                        });
                    }

                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life--;
                        if (p.life <= 0) this.particles.splice(i, 1);
                    }
                }

                draw() {
                    // Фазы: нарастание (10) -> держится -> угасание (20)
                    let intensity;
                    if (this.time < 10) intensity = this.time / 10;
                    else if (this.time > 50) intensity = Math.max(0, 1 - (this.time - 50) / 20);
                    else intensity = 1;
                    
                    if (intensity <= 0) return;
                    
                    ctx.save();
                    
                    // Частицы вокруг (позади луча)
                    for (const p of this.particles) {
                        const a = p.life / p.maxLife;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = `hsl(${p.hue}, 100%, 70%)`;
                        ctx.shadowColor = '#aaff00';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;

                    // Мягкое свечение вокруг
                    ctx.strokeStyle = `rgba(100, 255, 0, ${0.25 * intensity})`;
                    ctx.lineWidth = 60 * intensity;
                    ctx.shadowColor = '#66ff00';
                    ctx.shadowBlur = 50;
                    ctx.beginPath();
                    ctx.moveTo(this.startX, this.startY);
                    ctx.lineTo(this.endX, this.endY);
                    ctx.stroke();

                    // Основной луч (плотный)
                    ctx.strokeStyle = `rgba(150, 255, 50, ${0.8 * intensity})`;
                    ctx.lineWidth = 18 * intensity;
                    ctx.shadowColor = '#aaff00';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.moveTo(this.startX, this.startY);
                    ctx.lineTo(this.endX, this.endY);
                    ctx.stroke();
                    
                    // Яркое белое ядро
                    ctx.strokeStyle = `rgba(255, 255, 220, ${intensity})`;
                    ctx.lineWidth = 5 * intensity;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.moveTo(this.startX, this.startY);
                    ctx.lineTo(this.endX, this.endY);
                    ctx.stroke();

                    // Кислотные пузырьки вдоль луча
                    for (let i = 0; i < 15; i++) {
                        const offset = Math.sin(this.time * 0.4 + i * 1.5) * 15;
                        const t = (i / 15) + (this.time * 0.02) % 1;
                        const bx = this.startX + (this.endX - this.startX) * t;
                        const by = this.startY + (this.endY - this.startY) * t;
                        const nx = -Math.sin(this.angle);
                        const ny = Math.cos(this.angle);
                        
                        ctx.fillStyle = `rgba(200, 255, 150, ${0.8 * intensity})`;
                        ctx.shadowColor = '#ffffff';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(bx + nx * offset, by + ny * offset, 2 + Math.sin(this.time * 0.5 + i) * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Точка попадания
                    const hitPulse = 1 + Math.sin(this.time * 0.8) * 0.3;
                    const hitGlow = ctx.createRadialGradient(this.endX, this.endY, 0, this.endX, this.endY, 60 * intensity * hitPulse);
                    hitGlow.addColorStop(0, `rgba(240, 255, 200, ${intensity})`);
                    hitGlow.addColorStop(0.4, `rgba(150, 255, 50, ${0.6 * intensity})`);
                    hitGlow.addColorStop(1, 'rgba(50, 150, 0, 0)');
                    ctx.fillStyle = hitGlow;
                    ctx.beginPath();
                    ctx.arc(this.endX, this.endY, 60 * intensity * hitPulse, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Расходящиеся кольца
                    for (let k = 0; k < 3; k++) {
                        const ringT = ((this.time + k * 20) % 60) / 60;
                        ctx.strokeStyle = `rgba(200, 255, 100, ${(1 - ringT) * intensity * 0.8})`;
                        ctx.lineWidth = 4 * (1 - ringT);
                        ctx.beginPath();
                        ctx.arc(this.endX, this.endY, ringT * 100 * intensity, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    ctx.restore();
                }
            }

            // ============================================================
            // 2. ОБЛАКО ЗЕЛЁНОГО ДЫМА (Удлинённое в 2 раза от прошлого)
            // ============================================================
            class ToxicCloud {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.dead = false;
                    this.time = 0;
                    this.maxTime = 150;
                    
                    // Вытянутое по горизонтали (в 2 раза длиннее)
                    this.lengthScale = 6;
                    
                    this.puffs = [];
                    // 60 сфер для объёма
                    for (let i = 0; i < 60; i++) {
                        this.puffs.push({
                            offsetX: (Math.random() - 0.5) * 320, // Широко по X
                            offsetY: (Math.random() - 0.5) * 60,  // Узко по Y
                            radius: 20 + Math.random() * 35,
                            phaseX: Math.random() * Math.PI * 2,
                            phaseY: Math.random() * Math.PI * 2,
                            speed: 0.02 + Math.random() * 0.03,
                            hue: 80 + Math.random() * 30,
                            spawnTime: Math.random() * 40
                        });
                    }
                    
                    this.bubbles = [];
                }

                update() {
                    this.time++;
                    
                    if (this.time > this.maxTime) {
                        this.dead = true;
                    }
                    
                    if (this.time > 20 && this.time < 130 && Math.random() < 0.6) {
                        this.bubbles.push({
                            x: this.x + (Math.random() - 0.5) * 480, // Шире
                            y: this.y + (Math.random() - 0.5) * 80,
                            vx: (Math.random() - 0.5) * 1,
                            vy: -0.5 - Math.random() * 1.5,
                            life: 40 + Math.random() * 30,
                            maxLife: 70,
                            size: 2 + Math.random() * 5
                        });
                    }
                    
                    for (let i = this.bubbles.length - 1; i >= 0; i--) {
                        const b = this.bubbles[i];
                        b.x += b.vx;
                        b.y += b.vy;
                        b.life--;
                        if (b.life <= 0) this.bubbles.splice(i, 1);
                    }
                }

                draw() {
                    let intensity;
                    if (this.time < 40) intensity = this.time / 40;
                    else if (this.time < 120) intensity = 1;
                    else intensity = Math.max(0, 1 - (this.time - 120) / 30);
                    
                    if (intensity <= 0) return;
                    
                    ctx.save();
                    
                    // Общее свечение (сильно вытянутое)
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.scale(this.lengthScale, 1);
                    const totalGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, 60 * intensity);
                    totalGlow.addColorStop(0, `rgba(100, 200, 0, ${0.4 * intensity})`);
                    totalGlow.addColorStop(0.5, `rgba(60, 150, 0, ${0.2 * intensity})`);
                    totalGlow.addColorStop(1, 'rgba(20, 80, 0, 0)');
                    ctx.fillStyle = totalGlow;
                    ctx.beginPath();
                    ctx.arc(0, 0, 60 * intensity, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Объёмные сферы
                    for (const p of this.puffs) {
                        const puffProgress = Math.min(1, Math.max(0, (this.time - p.spawnTime) / 30));
                        if (puffProgress <= 0) continue;
                        
                        const ox = p.offsetX + Math.sin(this.time * p.speed + p.phaseX) * 20;
                        const oy = p.offsetY + Math.cos(this.time * p.speed + p.phaseY) * 15;
                        
                        const gx = this.x + ox * intensity;
                        const gy = this.y + oy * intensity;
                        
                        const currentRadius = p.radius * puffProgress * intensity;
                        
                        const puffGlow = ctx.createRadialGradient(gx, gy, 0, gx, gy, currentRadius);
                        puffGlow.addColorStop(0, `hsla(${p.hue}, 100%, 70%, ${0.5 * intensity * puffProgress})`);
                        puffGlow.addColorStop(0.4, `hsla(${p.hue}, 90%, 50%, ${0.3 * intensity * puffProgress})`);
                        puffGlow.addColorStop(1, `hsla(${p.hue}, 80%, 20%, 0)`);
                        
                        ctx.fillStyle = puffGlow;
                        ctx.beginPath();
                        ctx.arc(gx, gy, currentRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    // Пузырьки
                    for (const b of this.bubbles) {
                        const a = (b.life / b.maxLife) * intensity;
                        ctx.fillStyle = `rgba(200, 255, 100, ${a * 0.9})`;
                        ctx.shadowColor = '#aaff00';
                        ctx.shadowBlur = 12;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }
            }

            // ============================================================
            // 3. СНАРЯДЫ
            // ============================================================

            // 3а. ЯДРО ЯДА (Деление 1 -> 2 -> 4 -> 8)
            class SplittingPoisonCore {
                constructor(x, y, tx, ty, generation = 0, vx = 0, vy = 0) {
                    this.x = x;
                    this.y = y;
                    this.generation = generation; // 0=1, 1=2, 2=4, 3=8
                    this.dead = false;
                    this.time = 0;
                    this.maxTime = 30 * (3 - generation); // Живут меньше на поздних этапах
                    
                    if (generation === 0) {
                        // Первичное направление к цели
                        const dx = tx - x, dy = ty - y;
                        const dist = Math.hypot(dx, dy) || 1;
                        const speed = 6;
                        this.vx = dx / dist * speed;
                        this.vy = dy / dist * speed;
                    } else {
                        this.vx = vx;
                        this.vy = vy;
                    }
                    
                    // Размер уменьшается с каждым поколением
                    this.size = 14 * Math.pow(0.6, generation);
                    this.trail = [];
                    
                    // Углы шипов
                    this.spikes = [];
                    for (let i = 0; i < 8; i++) {
                        this.spikes.push({
                            angle: (i / 8) * Math.PI * 2,
                            speed: (Math.random() - 0.5) * 0.2
                        });
                    }
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > 8) this.trail.shift();
                    
                    this.time++;
                    
                    for (const s of this.spikes) s.angle += s.speed;
                    
                    // Деление
                    if (this.time >= this.maxTime && this.generation < 3) {
                        this.dead = true;
                        if (this.onSplit) this.onSplit(this);
                    }
                    
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
                        this.dead = true;
                    }
                }

                draw() {
                    const s = this.size;
                    
                    // Хвост
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const a = (i / this.trail.length) * 0.5;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = '#aaff00';
                        ctx.shadowColor = '#66ff00';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, (i / this.trail.length) * s, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    
                    // Свечение
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 3);
                    glow.addColorStop(0, 'rgba(180, 255, 80, 0.8)');
                    glow.addColorStop(0.5, 'rgba(100, 200, 20, 0.4)');
                    glow.addColorStop(1, 'rgba(40, 100, 0, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s * 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    
                    // Шипы
                    ctx.strokeStyle = '#ccff66';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#aaff00';
                    ctx.shadowBlur = 10;
                    for (const sp of this.spikes) {
                        const len = s * 0.8;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(sp.angle) * s * 0.7, Math.sin(sp.angle) * s * 0.7);
                        ctx.lineTo(Math.cos(sp.angle) * (s * 0.7 + len), Math.sin(sp.angle) * (s * 0.7 + len));
                        ctx.stroke();
                    }
                    
                    // Тело
                    const bodyGrad = ctx.createRadialGradient(-s * 0.3, -s * 0.3, 0, 0, 0, s);
                    bodyGrad.addColorStop(0, '#ffffcc');
                    bodyGrad.addColorStop(0.4, '#bbff44');
                    bodyGrad.addColorStop(0.8, '#55cc00');
                    bodyGrad.addColorStop(1, '#226600');
                    
                    ctx.fillStyle = bodyGrad;
                    ctx.shadowColor = '#aaff00';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    // Пульсация
                    const pulse = 1 + Math.sin(this.time * 0.5) * 0.1;
                    ctx.arc(0, 0, s * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Ядро
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
            }

            // 3б. МАЛИНКА
            class PoisonBerry {
                constructor(x, y, tx, ty) {
                    this.x = x; this.y = y;
                    const dx = tx - x, dy = ty - y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const speed = 7;
                    this.vx = dx / dist * speed;
                    this.vy = dy / dist * speed;
                    this.angle = Math.atan2(dy, dx);
                    this.targetX = tx; this.targetY = ty;
                    this.dead = false;
                    this.time = 0;
                    this.size = 11;
                    this.rotation = 0;
                    this.trail = [];
                    
                    this.berries = [];
                    for (let i = 0; i < 8; i++) {
                        const a = (i / 8) * Math.PI * 2;
                        this.berries.push({
                            angle: a,
                            dist: 4 + Math.random() * 2,
                            size: 3 + Math.random() * 2,
                            hue: 90 + Math.random() * 30
                        });
                    }
                }

                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > 12) this.trail.shift();
                    this.time += 0.15;
                    this.rotation += 0.15;
                    
                    if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 20) {
                        this.dead = true;
                        this.onHit && this.onHit(this.x, this.y);
                    }
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) this.dead = true;
                }

                draw() {
                    const s = this.size;
                    
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const a = (i / this.trail.length) * 0.5;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = '#aaff00';
                        ctx.shadowColor = '#66ff00';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, (i / this.trail.length) * 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 2.5);
                    glow.addColorStop(0, 'rgba(180, 255, 80, 0.6)');
                    glow.addColorStop(1, 'rgba(60, 150, 0, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    
                    for (const b of this.berries) {
                        const bx = Math.cos(b.angle) * b.dist;
                        const by = Math.sin(b.angle) * b.dist;
                        
                        const berryGrad = ctx.createRadialGradient(bx - b.size * 0.3, by - b.size * 0.3, 0, bx, by, b.size);
                        berryGrad.addColorStop(0, `hsl(${b.hue}, 100%, 75%)`);
                        berryGrad.addColorStop(0.6, `hsl(${b.hue}, 90%, 50%)`);
                        berryGrad.addColorStop(1, `hsl(${b.hue}, 80%, 30%)`);
                        
                        ctx.fillStyle = berryGrad;
                        ctx.shadowColor = `hsl(${b.hue}, 100%, 60%)`;
                        ctx.shadowBlur = 12;
                        ctx.beginPath();
                        ctx.arc(bx, by, b.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.6);
                    coreGrad.addColorStop(0, '#ffffff');
                    coreGrad.addColorStop(0.4, '#ccff66');
                    coreGrad.addColorStop(1, '#66cc00');
                    ctx.fillStyle = coreGrad;
                    ctx.shadowColor = '#aaff00';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    for (let i = 0; i < 4; i++) {
                        const a = (i / 4) * Math.PI * 2 + this.time;
                        const r = s * 0.35;
                        ctx.fillStyle = '#220044';
                        ctx.beginPath();
                        ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }
            }

            // 3в. МИНИ-ЛАЗЕР
            class MiniLaser {
                constructor(x, y, tx, ty) {
                    this.x = x; this.y = y;
                    const dx = tx - x, dy = ty - y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const speed = 14;
                    this.vx = dx / dist * speed;
                    this.vy = dy / dist * speed;
                    this.angle = Math.atan2(dy, dx);
                    this.targetX = tx; this.targetY = ty;
                    this.dead = false;
                    this.time = 0;
                    this.size = 8;
                    this.length = 40;
                }

                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.time += 0.2;
                    
                    if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 20) {
                        this.dead = true;
                        this.onHit && this.onHit(this.x, this.y);
                    }
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) this.dead = true;
                }

                draw() {
                    const s = this.size;
                    const dirX = Math.cos(this.angle);
                    const dirY = Math.sin(this.angle);
                    const tailX = this.x - dirX * this.length;
                    const tailY = this.y - dirY * this.length;
                    
                    ctx.save();
                    
                    ctx.strokeStyle = 'rgba(100, 255, 0, 0.3)';
                    ctx.lineWidth = 20;
                    ctx.shadowColor = '#66ff00';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.moveTo(tailX, tailY);
                    ctx.lineTo(this.x, this.y);
                    ctx.stroke();
                    
                    ctx.strokeStyle = 'rgba(150, 255, 50, 0.85)';
                    ctx.lineWidth = 8;
                    ctx.shadowColor = '#aaff00';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.moveTo(tailX, tailY);
                    ctx.lineTo(this.x, this.y);
                    ctx.stroke();
                    
                    ctx.strokeStyle = 'rgba(230, 255, 180, 1)';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.moveTo(tailX, tailY);
                    ctx.lineTo(this.x, this.y);
                    ctx.stroke();
                    
                    const headGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 3);
                    headGlow.addColorStop(0, 'rgba(240, 255, 200, 1)');
                    headGlow.addColorStop(0.4, 'rgba(150, 255, 50, 0.7)');
                    headGlow.addColorStop(1, 'rgba(50, 150, 0, 0)');
                    ctx.fillStyle = headGlow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s * 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    for (let k = 0; k < 2; k++) {
                        const r = (s * 1.5 + ((this.time * 8 + k * 10) % 20));
                        ctx.strokeStyle = `rgba(150, 255, 50, ${0.6 - k * 0.3})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    
                    ctx.restore();
                }
            }

            // ============================================================
            // ВЗРЫВ
            // ============================================================
            class AcidBurst {
                constructor(x, y, count = 25, spread = 5) {
                    this.x = x; this.y = y;
                    this.time = 0;
                    this.maxTime = 40;
                    this.particles = [];
                    for (let i = 0; i < count; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const speed = 1.5 + Math.random() * spread;
                        this.particles.push({
                            x: x, y: y,
                            vx: Math.cos(a) * speed,
                            vy: Math.sin(a) * speed,
                            life: 20 + Math.random() * 20,
                            maxLife: 40,
                            size: 1.5 + Math.random() * 4,
                            hue: 70 + Math.random() * 40
                        });
                    }
                    this.smoke = [];
                    for (let i = 0; i < 8; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const r = Math.random() * 20;
                        this.smoke.push({
                            x: x + Math.cos(a) * r,
                            y: y + Math.sin(a) * r,
                            vx: Math.cos(a) * 0.5,
                            vy: Math.sin(a) * 0.5 - 0.3,
                            life: 30 + Math.random() * 20,
                            maxLife: 50,
                            size: 10 + Math.random() * 15
                        });
                    }
                }
                update() {
                    this.time++;
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx; p.y += p.vy;
                        p.vx *= 0.93; p.vy *= 0.93;
                        p.life--;
                        if (p.life <= 0) this.particles.splice(i, 1);
                    }
                    for (let i = this.smoke.length - 1; i >= 0; i--) {
                        const s = this.smoke[i];
                        s.x += s.vx; s.y += s.vy;
                        s.vx *= 0.96; s.vy *= 0.96;
                        s.life--;
                        if (s.life <= 0) this.smoke.splice(i, 1);
                    }
                }
                draw() {
                    if (this.time < 10) {
                        const a = 1 - this.time / 10;
                        const r = 15 + this.time * 10;
                        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                        g.addColorStop(0, `rgba(220, 255, 150, ${a * 0.9})`);
                        g.addColorStop(0.5, `rgba(120, 255, 20, ${a * 0.5})`);
                        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    for (const s of this.smoke) {
                        const a = s.life / s.maxLife;
                        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size);
                        g.addColorStop(0, `rgba(100, 180, 40, ${a * 0.4})`);
                        g.addColorStop(1, 'rgba(50, 100, 0, 0)');
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    for (const p of this.particles) {
                        const a = p.life / p.maxLife;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = `hsl(${p.hue}, 100%, 60%)`;
                        ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
                get dead() { return this.time >= this.maxTime; }
            }

            // ============================================================
            // СПИСОК АТАК
            // ============================================================
            const attacks = [
                { name: '⚡ Лазер', type: 'laser' },
                { name: '☁ Облако дыма', type: 'cloud' },
                { name: '👾 Ядро яда', type: 'core' },
                { name: '🍇 Ягода', type: 'berry' },
                { name: '✴ Мини-лазер', type: 'minilaser' }
            ];

            let currentIndex = 0;

            const tabsContainer = document.getElementById('tabs');
            attacks.forEach((a, i) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
                btn.textContent = a.name;
                btn.onclick = () => {
                    currentIndex = i;
                    document.querySelectorAll('.tab-btn').forEach((b, j) => b.classList.toggle('active', j === i));
                };
                tabsContainer.appendChild(btn);
            });

            const activeLasers = [];
            const activeClouds = [];
            const activeProjectiles = [];
            const bursts = [];

            // Функция создания делящегося ядра (рекурсивно)
            function spawnPoisonCore(x, y, tx, ty, generation = 0, vx = 0, vy = 0) {
                const core = new SplittingPoisonCore(x, y, tx, ty, generation, vx, vy);
                
                core.onSplit = (c) => {
                    // Спавн двух новых ядер с отклонением
                    const angle = Math.atan2(c.vy, c.vx);
                    const spread = 0.6; // ~34 градуса в сторону
                    const speed = 5;
                    
                    const child1 = spawnPoisonCore(c.x, c.y, 0, 0, generation + 1, 
                        Math.cos(angle - spread) * speed, Math.sin(angle - spread) * speed);
                    const child2 = spawnPoisonCore(c.x, c.y, 0, 0, generation + 1, 
                        Math.cos(angle + spread) * speed, Math.sin(angle + spread) * speed);
                    
                    child1.onHit = (hx, hy) => bursts.push(new AcidBurst(hx, hy, 20, 4));
                    child2.onHit = (hx, hy) => bursts.push(new AcidBurst(hx, hy, 20, 4));
                    
                    activeProjectiles.push(child1);
                    activeProjectiles.push(child2);
                };
                
                return core;
            }

            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const startX = 60;
                const startY = height / 2;

                const attack = attacks[currentIndex];
                
                if (attack.type === 'laser') {
                    activeLasers.push(new AcidLaser(startX, startY, mx, my));
                } else if (attack.type === 'cloud') {
                    activeClouds.push(new ToxicCloud(mx, my));
                } else if (attack.type === 'core') {
                    const core = spawnPoisonCore(startX, startY, mx, my, 0);
                    core.onHit = (hx, hy) => bursts.push(new AcidBurst(hx, hy, 25, 5));
                    activeProjectiles.push(core);
                } else {
                    let proj;
                    if (attack.type === 'berry') proj = new PoisonBerry(startX, startY, mx, my);
                    else proj = new MiniLaser(startX, startY, mx, my);
                    
                    proj.onHit = (hx, hy) => {
                        bursts.push(new AcidBurst(hx, hy, 25, 5));
                    };
                    activeProjectiles.push(proj);
                }
            });

            function gameLoop() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                for (let i = activeLasers.length - 1; i >= 0; i--) {
                    activeLasers[i].update();
                    activeLasers[i].draw();
                    if (activeLasers[i].dead) activeLasers.splice(i, 1);
                }

                for (let i = activeClouds.length - 1; i >= 0; i--) {
                    activeClouds[i].update();
                    activeClouds[i].draw();
                    if (activeClouds[i].dead) activeClouds.splice(i, 1);
                }

                for (let i = activeProjectiles.length - 1; i >= 0; i--) {
                    activeProjectiles[i].update();
                    activeProjectiles[i].draw();
                    if (activeProjectiles[i].dead) activeProjectiles.splice(i, 1);
                }

                for (let i = bursts.length - 1; i >= 0; i--) {
                    bursts[i].update();
                    bursts[i].draw();
                    if (bursts[i].dead) bursts.splice(i, 1);
                }

                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        })();
    </script>
</body>
