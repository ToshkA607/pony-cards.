<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Атаки персонажей MLP</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        #tabs {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tab-btn {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        #hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="hint">Кликните — атака • Кнопки внизу — сменить персонажа</div>
    <div id="tabs"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();

            // ============================================================
            // 1. ДИСКОРД (ШАР)
            // ============================================================
            class DiscordChaos {
                constructor(x, y, tx, ty) {
                    this.x = x; this.y = y;
                    const dx = tx - x, dy = ty - y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const speed = 6;
                    this.vx = dx / dist * speed;
                    this.vy = dy / dist * speed;
                    this.angle = Math.atan2(dy, dx);
                    this.targetX = tx; this.targetY = ty;
                    this.dead = false;
                    this.time = 0;
                    this.trail = [];
                    this.size = 18;
                    this.chaosBits = [];
                    for (let i = 0; i < 8; i++) {
                        this.chaosBits.push({
                            angle: Math.random() * Math.PI * 2,
                            dist: 15 + Math.random() * 20,
                            size: 2 + Math.random() * 4,
                            hue: Math.random() * 360,
                            phase: Math.random() * Math.PI * 2,
                            speed: 0.05 + Math.random() * 0.15,
                            shape: Math.floor(Math.random() * 3)
                        });
                    }
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > 12) this.trail.shift();
                    this.time += 0.15;
                    for (const b of this.chaosBits) b.angle += b.speed;
                    if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 25) {
                        this.dead = true;
                        this.onHit && this.onHit(this.x, this.y);
                    }
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) this.dead = true;
                }
                draw() {
                    const s = this.size;
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const hue = (this.time * 80 + i * 40) % 360;
                        ctx.globalAlpha = (i / this.trail.length) * 0.5;
                        ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
                        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, (i / this.trail.length) * 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    const hue = (this.time * 80) % 360;
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 2.5);
                    glow.addColorStop(0, `hsla(${hue}, 100%, 65%, 0.5)`);
                    glow.addColorStop(1, `hsla(${(hue + 180) % 360}, 100%, 50%, 0)`);
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    for (const b of this.chaosBits) {
                        const px = Math.cos(b.angle) * b.dist;
                        const py = Math.sin(b.angle) * b.dist;
                        ctx.fillStyle = `hsl(${b.hue}, 100%, 60%)`;
                        ctx.shadowColor = `hsl(${b.hue}, 100%, 60%)`;
                        ctx.shadowBlur = 10;
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.rotate(b.angle * 2);
                        if (b.shape === 0) {
                            ctx.beginPath(); ctx.arc(0, 0, b.size, 0, Math.PI * 2); ctx.fill();
                        } else if (b.shape === 1) {
                            ctx.fillRect(-b.size, -b.size, b.size * 2, b.size * 2);
                        } else {
                            ctx.beginPath();
                            ctx.moveTo(0, -b.size);
                            ctx.lineTo(b.size, b.size);
                            ctx.lineTo(-b.size, b.size);
                            ctx.closePath();
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                    ctx.rotate(this.time);
                    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                    ctx.strokeStyle = `hsl(${(hue + 180) % 360}, 100%, 70%)`;
                    ctx.lineWidth = 2;
                    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    const sides = 7;
                    for (let i = 0; i < sides; i++) {
                        const a = (i / sides) * Math.PI * 2;
                        const r = s * (0.8 + Math.sin(this.time * 3 + i) * 0.3);
                        const px = Math.cos(a) * r, py = Math.sin(a) * r;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();
                    ctx.restore();
                }
            }

            // ============================================================
            // 2. ТОРНАДО (объёмные спиральные трубки) — ПРАВИЛЬНАЯ ОРИЕНТАЦИЯ
            // ============================================================
            class TornadoSpiral {
                constructor(x, y, tx, ty) {
                    this.x = x; this.y = y;
                    const dx = tx - x, dy = ty - y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const speed = 6.5;
                    this.vx = dx / dist * speed;
                    this.vy = dy / dist * speed;
                    this.angle = Math.atan2(dy, dx);
                    this.targetX = tx; this.targetY = ty;
                    this.dead = false;
                    this.time = 0;
                    this.trail = [];
                    this.size = 26;
                    this.rotation = 0;
                    
                    this.spirals = [];
                    const spiralCount = 8;
                    for (let i = 0; i < spiralCount; i++) {
                        this.spirals.push({
                            baseAngle: (i / spiralCount) * Math.PI * 2,
                            width: 0.3 + Math.random() * 0.15,
                            hue: 200 + (i % 3) * 20,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                    
                    this.particles = [];
                    for (let i = 0; i < 20; i++) {
                        this.particles.push({
                            t: Math.random(),
                            angle: Math.random() * Math.PI * 2,
                            speed: 0.1 + Math.random() * 0.15,
                            size: 2 + Math.random() * 4,
                            alpha: 0.4 + Math.random() * 0.4
                        });
                    }
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > 12) this.trail.shift();
                    this.time += 0.15;
                    this.rotation += 0.18;
                    for (const p of this.particles) p.angle += p.speed;
                    if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 25) {
                        this.dead = true;
                        this.onHit && this.onHit(this.x, this.y);
                    }
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) this.dead = true;
                }
                draw() {
                    const s = this.size;
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const a = (i / this.trail.length) * 0.25;
                        ctx.globalAlpha = a;
                        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, (i / this.trail.length) * 14);
                        g.addColorStop(0, 'rgba(180, 210, 255, 0.5)');
                        g.addColorStop(1, 'rgba(80, 120, 200, 0)');
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, (i / this.trail.length) * 14, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 2.8);
                    glow.addColorStop(0, 'rgba(180, 220, 255, 0.4)');
                    glow.addColorStop(0.5, 'rgba(100, 150, 255, 0.2)');
                    glow.addColorStop(1, 'rgba(40, 80, 200, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s * 2.8, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(-0.1);
                    
                    const totalLen = s * 4.5;
                    const topY = -totalLen / 2;    // верх
                    const bottomY = totalLen / 2;  // низ
                    
                    // ПРАВИЛЬНАЯ ОРИЕНТАЦИЯ: ШИРОКИЙ СВЕРХУ, УЗКИЙ СНИЗУ
                    for (let sIdx = 0; sIdx < this.spirals.length; sIdx++) {
                        const sp = this.spirals[sIdx];
                        
                        for (let pass = 0; pass < 3; pass++) {
                            const passOffset = (pass - 1) * s * 0.04;
                            const passAlpha = pass === 1 ? 1 : 0.4;
                            
                            ctx.beginPath();
                            
                            const steps = 50;
                            for (let i = 0; i <= steps; i++) {
                                const t = i / steps;
                                // t=0 сверху (широкий), t=1 снизу (узкий)
                                const r = s * (1.8 - t * 1.6); 
                                
                                const spiralAngle = sp.baseAngle + t * Math.PI * 2 * 4 + this.rotation + sp.phase;
                                
                                const xOff = Math.cos(spiralAngle) * r + passOffset;
                                const yOff = Math.sin(spiralAngle) * r * 0.45;
                                const y = topY + t * totalLen; // от верха к низу
                                
                                if (i === 0) ctx.moveTo(xOff, y + yOff);
                                else ctx.lineTo(xOff, y + yOff);
                            }
                            
                            if (pass === 1) {
                                ctx.strokeStyle = `hsla(${sp.hue}, 70%, 85%, ${passAlpha})`;
                                ctx.lineWidth = s * 0.15 * sp.width;
                                ctx.shadowColor = `hsl(${sp.hue}, 100%, 80%)`;
                                ctx.shadowBlur = 15;
                                ctx.stroke();
                            } else {
                                ctx.strokeStyle = `hsla(${sp.hue}, 40%, ${pass === 0 ? 30 : 50}%, ${passAlpha})`;
                                ctx.lineWidth = s * 0.1;
                                ctx.shadowBlur = 0;
                                ctx.stroke();
                            }
                        }
                    }
                    
                    // Частицы
                    for (const p of this.particles) {
                        const along = (p.t - 0.5) * totalLen;
                        // Широкий вверху (p.t=0 -> 1.8), узкий внизу (p.t=1 -> 0.2)
                        const r = s * (1.8 - p.t * 1.6);
                        const px = Math.cos(p.angle) * r * 1.1;
                        const py = along + Math.sin(p.angle) * r * 0.45;
                        
                        ctx.fillStyle = `rgba(200, 230, 255, ${p.alpha})`;
                        ctx.shadowColor = '#aaddff';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(px, py, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }
            }

            // ============================================================
            // 3. ЛУНА ВАРИАНТ 1 (свечение уменьшено в 2 раза)
            // ============================================================
            class MoonCrescent1 {
                constructor(x, y, tx, ty) {
                    this.x = x; this.y = y;
                    const dx = tx - x, dy = ty - y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const speed = 8;
                    this.vx = dx / dist * speed;
                    this.vy = dy / dist * speed;
                    this.angle = Math.atan2(dy, dx);
                    this.targetX = tx; this.targetY = ty;
                    this.dead = false;
                    this.time = 0;
                    this.trail = [];
                    this.size = 26;
                    this.rotation = 0;
                    this.sparkles = [];
                    for (let i = 0; i < 10; i++) {
                        this.sparkles.push({
                            angle: Math.random() * Math.PI * 2,
                            dist: 35 + Math.random() * 25,
                            phase: Math.random() * Math.PI * 2,
                            size: 1.5 + Math.random() * 2.5,
                            speed: 0.02 + Math.random() * 0.04
                        });
                    }
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > 16) this.trail.shift();
                    this.time += 0.1;
                    this.rotation += 0.03;
                    for (const sp of this.sparkles) sp.angle += sp.speed;
                    if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 22) {
                        this.dead = true;
                        this.onHit && this.onHit(this.x, this.y);
                    }
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) this.dead = true;
                }
                draw() {
                    const s = this.size;
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const t = i / this.trail.length;
                        const alpha = t * 0.5;
                        const hue = 250 + t * 30;
                        ctx.globalAlpha = alpha;
                        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, t * 12);
                        g.addColorStop(0, `hsl(${hue}, 100%, 75%)`);
                        g.addColorStop(1, `hsla(${hue}, 100%, 60%, 0)`);
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, t * 12, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    // Свечение уменьшено в 2 раза (s * 1.5 вместо s * 3)
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 1.5);
                    glow.addColorStop(0, 'rgba(150, 130, 255, 0.6)');
                    glow.addColorStop(0.5, 'rgba(90, 60, 200, 0.3)');
                    glow.addColorStop(1, 'rgba(20, 0, 60, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 1.2, Math.PI * 0.3, Math.PI * 1.7, false);
                    ctx.arc(s * 0.5, 0, s * 1.0, Math.PI * 1.65, Math.PI * 0.35, true);
                    ctx.closePath();
                    const crescentGrad = ctx.createRadialGradient(-s * 0.2, -s * 0.2, 0, 0, 0, s * 1.4);
                    crescentGrad.addColorStop(0, '#ffffff');
                    crescentGrad.addColorStop(0.5, '#ffffdd');
                    crescentGrad.addColorStop(1, '#ffffaa');
                    ctx.fillStyle = crescentGrad;
                    ctx.shadowColor = '#ffff88';
                    ctx.shadowBlur = 40;
                    ctx.fill();
                    ctx.strokeStyle = '#cc88ff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#aa44ff';
                    ctx.shadowBlur = 30;
                    ctx.stroke();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    ctx.restore();
                    for (const sp of this.sparkles) {
                        const px = this.x + Math.cos(sp.angle) * sp.dist;
                        const py = this.y + Math.sin(sp.angle) * sp.dist;
                        const twinkle = Math.sin(this.time * 6 + sp.phase) * 0.5 + 0.5;
                        ctx.globalAlpha = 0.4 + twinkle * 0.6;
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowColor = '#aaccff';
                        ctx.shadowBlur = 12;
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.rotate(this.time * 0.5 + sp.phase);
                        ctx.beginPath();
                        for (let k = 0; k < 8; k++) {
                            const a = (k / 8) * Math.PI * 2;
                            const r = k % 2 === 0 ? sp.size * 2 : sp.size * 0.5;
                            const sx = Math.cos(a) * r, sy = Math.sin(a) * r;
                            if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.globalAlpha = 1;
                }
            }

            // ============================================================
            // 4. ЛУНА ВАРИАНТ 2 (свечение уменьшено в 2 раза)
            // ============================================================
            class MoonCrescent2 {
                constructor(x, y, tx, ty) {
                    this.x = x; this.y = y;
                    const dx = tx - x, dy = ty - y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const speed = 8.5;
                    this.vx = dx / dist * speed;
                    this.vy = dy / dist * speed;
                    this.angle = Math.atan2(dy, dx);
                    this.targetX = tx; this.targetY = ty;
                    this.dead = false;
                    this.time = 0;
                    this.trail = [];
                    this.size = 22;
                    this.orbit = 0;
                    this.serpRot = 0;
                    
                    this.stars = [];
                    for (let i = 0; i < 6; i++) {
                        this.stars.push({
                            angle: Math.random() * Math.PI * 2,
                            dist: 25 + Math.random() * 15,
                            size: 1.5 + Math.random() * 1.5,
                            phase: Math.random() * Math.PI * 2,
                            speed: 0.02 + Math.random() * 0.03
                        });
                    }
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > 16) this.trail.shift();
                    this.time += 0.1;
                    this.orbit += 0.04;
                    this.serpRot += 0.02;
                    for (const st of this.stars) st.angle += st.speed;
                    if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 22) {
                        this.dead = true;
                        this.onHit && this.onHit(this.x, this.y);
                    }
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) this.dead = true;
                }
                draw() {
                    const s = this.size;
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const t = i / this.trail.length;
                        ctx.globalAlpha = t * 0.5;
                        const hue = 250 + t * 40;
                        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, t * 12);
                        g.addColorStop(0, `hsl(${hue}, 100%, 75%)`);
                        g.addColorStop(1, `hsla(${hue}, 100%, 60%, 0)`);
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, t * 12, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    // Свечение уменьшено в 2 раза (s * 1.5 вместо s * 3)
                    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 1.5);
                    glow.addColorStop(0, 'rgba(140, 110, 255, 0.6)');
                    glow.addColorStop(0.5, 'rgba(70, 40, 180, 0.3)');
                    glow.addColorStop(1, 'rgba(10, 0, 50, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    
                    const body = ctx.createRadialGradient(-s * 0.2, -s * 0.2, 0, 0, 0, s * 0.4);
                    body.addColorStop(0, '#8a6adf');
                    body.addColorStop(0.6, '#1a1045');
                    body.addColorStop(1, '#000');
                    ctx.fillStyle = body;
                    ctx.strokeStyle = '#aa88ff';
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = '#8866dd';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.4, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();
                    
                    for (let i = 0; i < 2; i++) {
                        const a = this.orbit + i * Math.PI;
                        const orbitR = s * 1.1;
                        const cx = Math.cos(a) * orbitR;
                        const cy = Math.sin(a) * orbitR * 0.7;
                        
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(this.serpRot + i * Math.PI / 2 + a * 0.5);
                        
                        const serpSize = s * 0.35;
                        
                        ctx.beginPath();
                        ctx.arc(0, 0, serpSize, Math.PI * 0.3, Math.PI * 1.7, false);
                        ctx.arc(serpSize * 0.4, 0, serpSize * 0.85, Math.PI * 1.65, Math.PI * 0.35, true);
                        ctx.closePath();
                        
                        const grad = ctx.createRadialGradient(-serpSize * 0.2, 0, 0, 0, 0, serpSize);
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(1, '#ffffaa');
                        ctx.fillStyle = grad;
                        ctx.shadowColor = '#ffff88';
                        ctx.shadowBlur = 25;
                        ctx.fill();
                        
                        ctx.strokeStyle = '#cc88ff';
                        ctx.lineWidth = 1.5;
                        ctx.shadowColor = '#aa44ff';
                        ctx.shadowBlur = 18;
                        ctx.stroke();
                        
                        ctx.restore();
                    }
                    
                    for (const st of this.stars) {
                        const px = Math.cos(st.angle) * st.dist;
                        const py = Math.sin(st.angle) * st.dist;
                        const twinkle = Math.sin(this.time * 6 + st.phase) * 0.5 + 0.5;
                        
                        ctx.globalAlpha = 0.3 + twinkle * 0.7;
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowColor = '#aaccff';
                        ctx.shadowBlur = 15;
                        
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.rotate(this.time * 2 + st.phase);
                        
                        ctx.beginPath();
                        for (let k = 0; k < 4; k++) {
                            const a = (k / 4) * Math.PI * 2;
                            const r = k % 2 === 0 ? st.size * 2.5 : st.size * 0.5;
                            const sx = Math.cos(a) * r, sy = Math.sin(a) * r;
                            if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                        }
                        ctx.closePath();
                        ctx.fill();
                        
                        ctx.restore();
                    }
                    ctx.globalAlpha = 1;
                    
                    ctx.restore();
                }
            }

            // ============================================================
            // ВЗРЫВ
            // ============================================================
            class Burst {
                constructor(x, y, colors, count = 25, spread = 5) {
                    this.x = x; this.y = y;
                    this.time = 0;
                    this.maxTime = 30;
                    this.particles = [];
                    this.colors = colors;
                    for (let i = 0; i < count; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const speed = 1.5 + Math.random() * spread;
                        this.particles.push({
                            x: x, y: y,
                            vx: Math.cos(a) * speed,
                            vy: Math.sin(a) * speed,
                            life: 20 + Math.random() * 20,
                            maxLife: 40,
                            size: 1.5 + Math.random() * 3,
                            color: colors[Math.floor(Math.random() * colors.length)]
                        });
                    }
                }
                update() {
                    this.time++;
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx; p.y += p.vy;
                        p.vx *= 0.93; p.vy *= 0.93;
                        p.life--;
                        if (p.life <= 0) this.particles.splice(i, 1);
                    }
                }
                draw() {
                    if (this.time < 8) {
                        const a = 1 - this.time / 8;
                        const r = 15 + this.time * 7;
                        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                        g.addColorStop(0, `rgba(255, 255, 255, ${a * 0.8})`);
                        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    for (const p of this.particles) {
                        const a = p.life / p.maxLife;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = p.color;
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
                get dead() { return this.time >= this.maxTime; }
            }

            // ============================================================
            // СПИСОК ПЕРСОНАЖЕЙ
            // ============================================================
            const characters = [
                { name: '🌀 Дискорд', class: DiscordChaos, colors: ['#ff0000', '#ff8800', '#ffff00', '#00ff00', '#00ffff', '#0088ff', '#8800ff', '#ff00ff'], count: 35, spread: 6 },
                { name: '🌪 Торнадо', class: TornadoSpiral, colors: ['#aaddff', '#88bbff', '#ffffff', '#6688dd', '#ccddff', '#ff8800'], count: 40, spread: 6.5 },
                { name: '🌙 Луна 1', class: MoonCrescent1, colors: ['#8866dd', '#aa88ff', '#ffffcc', '#1a1045', '#ffffff', '#6688dd', '#ffccff'], count: 30, spread: 5.5 },
                { name: '🌙 Луна 2', class: MoonCrescent2, colors: ['#8866dd', '#aa88ff', '#ffffcc', '#1a1045', '#ffffff', '#6688dd', '#ffccff'], count: 30, spread: 5.5 }
            ];

            let currentIndex = 0;

            const tabsContainer = document.getElementById('tabs');
            characters.forEach((c, i) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
                btn.textContent = c.name;
                btn.onclick = () => {
                    currentIndex = i;
                    document.querySelectorAll('.tab-btn').forEach((b, j) => b.classList.toggle('active', j === i));
                };
                tabsContainer.appendChild(btn);
            });

            const projectiles = [];
            const bursts = [];

            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const startX = 60;
                const startY = height / 2;

                const char = characters[currentIndex];
                const p = new char.class(startX, startY, mx, my);
                p.onHit = (hx, hy) => {
                    bursts.push(new Burst(hx, hy, char.colors, char.count, char.spread));
                };
                projectiles.push(p);
            });

            function gameLoop() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                for (let i = projectiles.length - 1; i >= 0; i--) {
                    projectiles[i].update();
                    projectiles[i].draw();
                    if (projectiles[i].dead) projectiles.splice(i, 1);
                }
                for (let i = bursts.length - 1; i >= 0; i--) {
                    bursts[i].update();
                    bursts[i].draw();
                    if (bursts[i].dead) bursts.splice(i, 1);
                }

                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        })();
    </script>
</body>
</html>
