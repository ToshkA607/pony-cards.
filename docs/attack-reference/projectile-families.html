<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Снаряды</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            border-left: 4px solid #00aaff;
            z-index: 100;
            pointer-events: none;
        }
        #info h1 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #00aaff;
            text-shadow: 0 0 10px #00aaff;
            font-weight: 400;
            letter-spacing: 1px;
        }
        #info p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        #projectileTabs {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }
        .tab-btn {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-btn:hover {
            background: rgba(0, 170, 255, 0.3);
            border-color: #00aaff;
        }
        .tab-btn.active {
            background: rgba(0, 170, 255, 0.5);
            border-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
        }
        .tab-btn.electric {
            background: rgba(0, 255, 200, 0.2);
            border-color: rgba(0, 255, 200, 0.5);
        }
        .tab-btn.electric.active {
            background: rgba(0, 255, 200, 0.5);
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.6);
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🎯 СНАРЯДЫ</h1>
        <p>Кликните — выстрел • Кнопки внизу — сменить тип</p>
    </div>

    <div id="projectileTabs"></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();

            // ============================================================
            // БАЗОВЫЙ КЛАСС СНАРЯДА
            // ============================================================
            class Projectile {
                constructor(x, y, targetX, targetY) {
                    this.x = x;
                    this.y = y;
                    const dx = targetX - x;
                    const dy = targetY - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const speed = 12;
                    this.vx = (dx / dist) * speed;
                    this.vy = (dy / dist) * speed;
                    this.angle = Math.atan2(dy, dx);
                    this.targetX = targetX;
                    this.targetY = targetY;
                    this.life = 100;
                    this.dead = false;
                    this.trail = [];
                    this.trailMax = 10;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > this.trailMax) this.trail.shift();
                    this.life--;
                    if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 15) {
                        this.dead = true;
                        this.onHit && this.onHit();
                    }
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
                        this.dead = true;
                    }
                }
                draw() {}
            }

            // ============================================================
            // 1. ЭНЕРГЕТИЧЕСКАЯ СФЕРА (фиолетовая с кольцами)
            // ============================================================
            class EnergySphere extends Projectile {
                constructor(x, y, tx, ty) {
                    super(x, y, tx, ty);
                    this.size = 11;
                    this.time = 0;
                    this.rings = [];
                    for (let i = 0; i < 3; i++) {
                        this.rings.push({
                            offset: i * Math.PI / 3,
                            speed: 1 + i * 0.5,
                            size: 1.5 + i * 0.4
                        });
                    }
                }
                update() {
                    super.update();
                    this.time += 0.1;
                }
                draw() {
                    ctx.save();
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const a = (i / this.trail.length) * 0.4;
                        const s = (i / this.trail.length) * this.size * 1.5;
                        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s);
                        g.addColorStop(0, 'rgba(200, 0, 255, 0.8)');
                        g.addColorStop(1, 'rgba(100, 0, 150, 0)');
                        ctx.globalAlpha = a;
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3.5);
                    grad.addColorStop(0, 'rgba(255, 100, 255, 0.8)');
                    grad.addColorStop(0.4, 'rgba(180, 0, 255, 0.5)');
                    grad.addColorStop(1, 'rgba(80, 0, 150, 0)');
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#ff88ff';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    for (const ring of this.rings) {
                        const a = this.time * ring.speed + ring.offset;
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(a);
                        ctx.scale(ring.size, 1);
                        ctx.strokeStyle = 'rgba(255, 150, 255, 0.8)';
                        ctx.lineWidth = 2;
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size * 1.3, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();
                    }
                    ctx.restore();
                }
            }

            // ============================================================
            // 2. КИСЛОТНЫЙ ШАР (зелёный с каплями)
            // ============================================================
            class AcidBall extends Projectile {
                constructor(x, y, tx, ty) {
                    super(x, y, tx, ty);
                    this.size = 10;
                    this.time = 0;
                    this.drops = [];
                }
                update() {
                    super.update();
                    this.time += 0.15;
                    if (Math.random() < 0.5) {
                        this.drops.push({
                            x: this.x + (Math.random() - 0.5) * 15,
                            y: this.y + (Math.random() - 0.5) * 15,
                            vx: -this.vx * 0.2 + (Math.random() - 0.5) * 2,
                            vy: -this.vy * 0.2 + (Math.random() - 0.5) * 2 + 1,
                            life: 25,
                            maxLife: 25,
                            size: 2 + Math.random() * 3
                        });
                    }
                    for (let i = this.drops.length - 1; i >= 0; i--) {
                        const d = this.drops[i];
                        d.x += d.vx;
                        d.y += d.vy;
                        d.vy += 0.1;
                        d.life--;
                        if (d.life <= 0) this.drops.splice(i, 1);
                    }
                }
                draw() {
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const a = (i / this.trail.length) * 0.5;
                        const s = (i / this.trail.length) * this.size;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = '#44ff44';
                        ctx.shadowColor = '#44ff44';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
                    grad.addColorStop(0, 'rgba(150, 255, 100, 0.9)');
                    grad.addColorStop(0.4, 'rgba(50, 200, 50, 0.5)');
                    grad.addColorStop(1, 'rgba(0, 100, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = '#00ff00';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    const points = 12;
                    for (let i = 0; i < points; i++) {
                        const a = (i / points) * Math.PI * 2;
                        const r = this.size * 3 * (0.9 + Math.sin(this.time * 3 + i) * 0.1);
                        const px = this.x + Math.cos(a) * r;
                        const py = this.y + Math.sin(a) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#ccff88';
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    for (const d of this.drops) {
                        const a = d.life / d.maxLife;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = '#66ff66';
                        ctx.shadowColor = '#00ff00';
                        ctx.shadowBlur = 8;
                        ctx.beginPath();
                        ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ============================================================
            // 3. ТЁМНАЯ МАТЕРИЯ (чёрный шар с фиолетовым ореолом)
            // ============================================================
            class DarkMatter extends Projectile {
                constructor(x, y, tx, ty) {
                    super(x, y, tx, ty);
                    this.size = 11;
                    this.time = 0;
                }
                update() {
                    super.update();
                    this.time += 0.12;
                }
                draw() {
                    ctx.save();
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const a = (i / this.trail.length) * 0.4;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = '#330066';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, (i / this.trail.length) * this.size * 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    const glow = ctx.createRadialGradient(this.x, this.y, this.size, this.x, this.y, this.size * 3);
                    glow.addColorStop(0, 'rgba(180, 0, 255, 0.7)');
                    glow.addColorStop(0.5, 'rgba(100, 0, 200, 0.4)');
                    glow.addColorStop(1, 'rgba(50, 0, 100, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowColor = '#cc00ff';
                    ctx.shadowBlur = 30;
                    const bodyGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                    bodyGrad.addColorStop(0, '#000000');
                    bodyGrad.addColorStop(0.8, '#0a001a');
                    bodyGrad.addColorStop(1, '#330066');
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#cc00ff';
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = '#ff00ff';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.1, 0, Math.PI * 2);
                    ctx.stroke();
                    for (let i = 0; i < 4; i++) {
                        const a = this.time * 2 + i * Math.PI / 2;
                        const r = this.size * 1.8;
                        const px = this.x + Math.cos(a) * r;
                        const py = this.y + Math.sin(a) * r;
                        ctx.fillStyle = '#ff88ff';
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(px, py, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // ============================================================
            // 4. БИРЮЗОВАЯ МОЛНИЯ (шар с электрическими дугами)
            // ============================================================
            class TurquoiseLightning extends Projectile {
                constructor(x, y, tx, ty) {
                    super(x, y, tx, ty);
                    this.size = 10;
                    this.time = 0;
                    this.bolts = [];
                }
                update() {
                    super.update();
                    this.time += 0.2;
                    if (Math.random() < 0.5 || this.bolts.length === 0) {
                        this.bolts = [];
                        for (let i = 0; i < 5; i++) {
                            const points = [];
                            const angle = Math.random() * Math.PI * 2;
                            const len = 15 + Math.random() * 25;
                            let cx = 0, cy = 0;
                            points.push({x: 0, y: 0});
                            for (let j = 0; j < 4; j++) {
                                const t = (j + 1) / 4;
                                cx = Math.cos(angle) * len * t + (Math.random() - 0.5) * 12;
                                cy = Math.sin(angle) * len * t + (Math.random() - 0.5) * 12;
                                points.push({x: cx, y: cy});
                            }
                            this.bolts.push(points);
                        }
                    }
                }
                draw() {
                    ctx.save();
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const a = (i / this.trail.length) * 0.5;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = '#00ffcc';
                        ctx.shadowColor = '#00ffcc';
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, (i/this.trail.length) * this.size * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
                    grad.addColorStop(0, 'rgba(150, 255, 220, 0.9)');
                    grad.addColorStop(0.4, 'rgba(0, 230, 200, 0.5)');
                    grad.addColorStop(1, 'rgba(0, 100, 100, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#00ffcc';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#aaffee';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 15;
                    for (const bolt of this.bolts) {
                        ctx.beginPath();
                        for (let i = 0; i < bolt.length; i++) {
                            const px = this.x + bolt[i].x;
                            const py = this.y + bolt[i].y;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            // ============================================================
            // 5. РАДУЖНЫЙ ШАР (разноцветный)
            // ============================================================
            class RainbowOrb extends Projectile {
                constructor(x, y, tx, ty) {
                    super(x, y, tx, ty);
                    this.size = 11;
                    this.time = 0;
                }
                update() {
                    super.update();
                    this.time += 0.15;
                }
                draw() {
                    ctx.save();
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const a = (i / this.trail.length) * 0.5;
                        const hue = (this.time * 60 + i * 30) % 360;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
                        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, (i/this.trail.length) * this.size * 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    const hue = (this.time * 60) % 360;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3.5);
                    grad.addColorStop(0, `hsla(${hue}, 100%, 70%, 0.9)`);
                    grad.addColorStop(0.4, `hsla(${(hue + 60) % 360}, 100%, 60%, 0.5)`);
                    grad.addColorStop(1, `hsla(${(hue + 120) % 360}, 100%, 50%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ============================================================
            // СПИСОК СНАРЯДОВ
            // ============================================================
            const projectileTypes = [
                { name: '🔮 Энергия', class: EnergySphere, color: '#cc00ff', electric: false },
                { name: '☣ Кислота', class: AcidBall, color: '#44ff44', electric: false },
                { name: '🌑 Тьма', class: DarkMatter, color: '#cc00ff', electric: false },
                { name: '⚡ Молния', class: TurquoiseLightning, color: '#00ffcc', electric: true },
                { name: '🌈 Радуга', class: RainbowOrb, color: '#ffffff', electric: false }
            ];

            let currentTypeIndex = 0;

            // ---- UI кнопки ----
            const tabsContainer = document.getElementById('projectileTabs');
            projectileTypes.forEach((type, i) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (i === 0 ? ' active' : '') + (type.electric ? ' electric' : '');
                btn.textContent = type.name;
                btn.onclick = () => {
                    currentTypeIndex = i;
                    document.querySelectorAll('.tab-btn').forEach((b, j) => {
                        b.classList.toggle('active', j === i);
                    });
                };
                tabsContainer.appendChild(btn);
            });

            // ---- Игровое состояние ----
            const projectiles = [];
            const explosions = [];

            class Explosion {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.time = 0;
                    this.maxTime = 25;
                    this.particles = [];
                    for (let i = 0; i < 20; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const speed = 2 + Math.random() * 5;
                        this.particles.push({
                            x: x, y: y,
                            vx: Math.cos(a) * speed,
                            vy: Math.sin(a) * speed,
                            life: 20 + Math.random() * 15,
                            maxLife: 35,
                            size: 2 + Math.random() * 3
                        });
                    }
                }
                update() {
                    this.time++;
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vx *= 0.94;
                        p.vy *= 0.94;
                        p.life--;
                        if (p.life <= 0) this.particles.splice(i, 1);
                    }
                }
                draw() {
                    if (this.time < 8) {
                        const a = 1 - this.time / 8;
                        const r = 10 + this.time * 8;
                        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                        g.addColorStop(0, `rgba(255, 255, 255, ${a})`);
                        g.addColorStop(0.5, this.color.replace(')', `, ${a * 0.6})`).replace('rgb', 'rgba'));
                        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    for (const p of this.particles) {
                        const a = p.life / p.maxLife;
                        ctx.globalAlpha = a;
                        ctx.fillStyle = this.color;
                        ctx.shadowColor = this.color;
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                get dead() { return this.time >= this.maxTime; }
            }

            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                
                const startX = 60;
                const startY = height / 2;
                
                const ProjClass = projectileTypes[currentTypeIndex].class;
                const proj = new ProjClass(startX, startY, mx, my);
                
                const color = projectileTypes[currentTypeIndex].color;
                proj.onHit = () => {
                    explosions.push(new Explosion(proj.x, proj.y, color));
                };
                
                projectiles.push(proj);
            });

            function drawBackground() {
                // Статичный фон без мигания
                const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height) * 0.8);
                grad.addColorStop(0, '#0a0a1a');
                grad.addColorStop(0.6, '#050510');
                grad.addColorStop(1, '#000000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
                
                ctx.strokeStyle = 'rgba(0, 100, 200, 0.06)';
                ctx.lineWidth = 1;
                const gs = 60;
                for (let x = 0; x < width; x += gs) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }
                for (let y = 0; y < height; y += gs) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                }
            }

            function gameLoop() {
                ctx.clearRect(0, 0, width, height);
                drawBackground();
                
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    projectiles[i].update();
                    projectiles[i].draw();
                    if (projectiles[i].dead) {
                        projectiles.splice(i, 1);
                    }
                }
                
                for (let i = explosions.length - 1; i >= 0; i--) {
                    explosions[i].update();
                    explosions[i].draw();
                    if (explosions[i].dead) {
                        explosions.splice(i, 1);
                    }
                }
                
                requestAnimationFrame(gameLoop);
            }

            gameLoop();

            setTimeout(() => {
                const ProjClass = projectileTypes[0].class;
                const proj = new ProjClass(60, height/2, width * 0.8, height * 0.3);
                proj.onHit = () => explosions.push(new Explosion(proj.x, proj.y, '#cc00ff'));
                projectiles.push(proj);
            }, 1000);
        })();
    </script>
</body>
